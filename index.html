<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sanjay — portfolio</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="assets/favicon.png" sizes="any" />
  </head>
  <body>
    <script src="js/icons.js"></script>

    <div class="app-shell">
      <!-- HEADER / NAV -->
      <header class="app-header">
        <span class="prompt-label">~sanjay$</span>
        <div id="page-entries"></div>
        <div class="header-spacer"></div>
        <span class="clock" id="clock">00:00:00</span>
      </header>

      <!-- SINGLE SCREEN — both header nav and launcher target this one window -->
      <div class="screen-container">
        <div class="terminal-window" id="terminal-window">
          <div class="window-titlebar">
            <span class="dot"></span><span class="dot"></span
            ><span class="dot"></span>
            <span class="window-title" id="window-title">~/blank</span>
            <div class="header-spacer"></div>
            <button id="share-btn" title="Open page" aria-label="Open page">
              <svg width="14" height="14">
                <use href="#icon-share"></use>
              </svg>
            </button>
          </div>
          <!-- Hot-cache host: JS creates one <iframe> per visited page here
               (up to a fixed cache size) and toggles which one is visible.
               Nothing renders until a page is actually requested. -->
          <div class="screen-body">
            <div id="screen-frames" class="screen-frames"></div>

            <!-- Shown over the active frame until its page finishes loading;
                 hidden instantly on cache hits since those pages already
                 finished loading before. -->
            <div id="screen-skeleton" class="screen-skeleton" aria-hidden="true">
              <div class="skeleton-line w-40"></div>
              <div class="skeleton-line w-70"></div>
              <div class="skeleton-line w-55"></div>
              <div class="skeleton-block"></div>
              <div class="skeleton-line w-60"></div>
              <div class="skeleton-line w-35"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- LAUNCHER — floating fab + anchored overlay panel -->
      <button
        class="launcher-fab"
        id="launcher-toggle"
        aria-label="Open project launcher"
        aria-expanded="false"
      >
        <svg><use href="#icon-apps"></use></svg>
      </button>

      <div class="click-catcher" id="click-catcher"></div>

      <div class="launcher-panel" id="launcher-panel">
        <p class="launcher-heading">~/projects</p>
        <div class="launcher-list" id="launcher-list">
          <!-- populated by js/main.js from #projects-data -->
        </div>
      </div>

      <!-- fed by whichever .launch-item is currently hovered/focused,
           see updateDetail() in js/main.js -->
      <div class="launcher-detail" id="launcher-detail" aria-hidden="true">
        <div class="detail-head">
          <span class="detail-icon">
            <svg id="detail-icon-use"><use href="#icon-apps"></use></svg>
          </span>
          <div>
            <p class="detail-name" id="detail-name">—</p>
            <p class="detail-date" id="detail-date">—</p>
          </div>
        </div>
        <p class="detail-description" id="detail-description"></p>
        <a
          class="detail-github"
          id="detail-github"
          href="#"
          target="_blank"
          rel="noopener"
        >
          <svg><use href="#icon-share"></use></svg>
          View on GitHub
        </a>
      </div>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
